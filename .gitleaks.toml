# Secret scanning (§24 stage 1, §17 security).
#
# Extends the upstream ruleset rather than replacing it — the default rules
# cover the providers that matter to us (Anthropic, AWS, GitHub, Postgres URLs,
# private keys) and are maintained by people who watch for new token formats.
[extend]
useDefault = true

[[rules]]
id = "atelier-anthropic-key"
description = "Anthropic API key"
# Belt and braces: the upstream ruleset covers this, but the platform is built
# on Claude (ADR-004) and a leaked model key is the single most likely and most
# expensive credential incident we can have.
regex = '''sk-ant-[a-zA-Z0-9_\-]{20,}'''
keywords = ["sk-ant-"]

[allowlist]
description = "Paths that legitimately contain secret-shaped strings"
paths = [
  '''pnpm-lock\.yaml''',      # integrity hashes look like high-entropy secrets
  '''\.playwright-mcp/''',    # transient browser-automation artifacts
  '''storybook-static/''',    # build output

  # The redaction suite's fixtures. These files exist to prove that a
  # secret-shaped string never reaches a log (NFR-OBS-2), which requires holding
  # convincingly secret-shaped strings — so the scanner flags them, correctly and
  # uselessly. Every value is synthetic: sequential hex, or AWS's own published
  # example key AKIAIOSFODNN7EXAMPLE.
  #
  # This is latent rather than active: gitleaks-action scans the commits in a
  # push, and these were introduced in M006 and are already on main. The trap it
  # removes is for whoever next edits one of these files and gets six "leaks" on
  # work that has nothing to do with them.
  #
  # Scoped to these two files by exact path, NOT to test files generally — a real
  # credential pasted into any other test still fails the build.
  '''packages/observability/src/redaction\.test\.ts''',
  '''packages/observability/src/logger\.test\.ts''',
]
# Documented, non-secret placeholders. Anchored to the exact literal so a real
# key that happens to sit nearby is still caught.
regexes = [
  '''sk-ant-EXAMPLE''',
  '''sk-or-EXAMPLE''',
  '''gsk_EXAMPLE''',
  '''postgres://postgres:postgres@localhost''',
]
