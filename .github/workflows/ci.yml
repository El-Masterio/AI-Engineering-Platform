name: CI

# §24 stages 1, 2, 3 and 4. Stage 3 arrived with M004, when there was finally a
# database for it to assert against — a job that passes because it has nothing
# to run is not a gate, so it was left out until it had teeth.
#
# Runs on every branch push, not only on pull requests, so a milestone branch is
# verified before a PR exists. Same-repo PRs therefore get two runs; the
# concurrency group below cancels superseded ones, and the duplicate is worth
# the earlier feedback.

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Action versions are on the Node 24 runtime. The v4/v2 generation runs on
# Node 20, which GitHub removes from hosted runners in September 2026 — the
# first run of this pipeline warned about exactly that on all three jobs.

env:
  # Turborepo remote cache. Absent secrets are empty strings, which turbo treats
  # as "no remote cache" and falls back to the local one restored below — so the
  # pipeline works unconfigured and gets faster the moment an owner adds them.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # Turbo prints a hyperlinked summary that is noise in CI logs.
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # ── [1] Static analysis ──────────────────────────────────────────────────
  static:
    name: "[1] Static analysis"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks needs history to scan the commits a PR actually adds;
          # a shallow clone would only ever see the tip.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # Cheapest check first, before anything has to be built.
      - name: Formatting
        run: pnpm format:check

      # ESLint's type-aware rules need the workspace packages' .d.ts files:
      # apps/* resolve `@atelier/*` through the package `exports` map to dist/.
      # Without this, every cross-package symbol is an unresolved type and the
      # no-unsafe-* rules fire on correct code. Apps are excluded — nothing
      # depends on them, so building them here would be pure waste.
      #
      # This step is why the first CI run failed while the same commands passed
      # locally: a stale dist/ was on disk here and absent on a clean checkout.
      - name: Build workspace packages (types for the lint step)
        run: pnpm turbo run build --filter='./packages/*'

      - name: Lint
        run: pnpm lint

      - name: Dependency graph — no cycles, no boundary violations
        run: pnpm depcruise

      - name: Dead code
        run: pnpm knip

      - name: Design token contrast (WCAG 2.2 AA)
        run: pnpm check:contrast

      - name: Dependency licences
        run: pnpm check:licenses

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── [2] Unit + contract ──────────────────────────────────────────────────
  test:
    name: "[2] Unit + coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # No build step: vitest.config.ts aliases `@atelier/*` to source, so the
      # suite exercises the code we wrote rather than a build artifact and does
      # not depend on task ordering.
      #
      # Coverage floors come from §23 and are enforced in vitest.config.ts, so
      # a drop below them fails here rather than being reported and ignored.
      - name: Vitest with coverage floors
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── [3] Integration ──────────────────────────────────────────────────────
  integration:
    name: "[3] Integration"
    runs-on: ubuntu-latest
    # Longer than the others: each test file starts its own Postgres container.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Docker is present on ubuntu-latest, so Testcontainers needs no service
      # block — it manages container lifecycle itself. Using `services:` would
      # pin one shared database for the whole job and lose the per-file
      # isolation the suite relies on.
      - name: Cross-tenant isolation, migrations, and schema drift
        run: pnpm test:integration

  # ── [4] Build ────────────────────────────────────────────────────────────
  build:
    name: "[4] Build + typecheck"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Local Turborepo cache. Keyed by commit so a re-run of the same SHA is a
      # no-op; restore-keys let a new commit start from the previous build's
      # cache instead of cold. Redundant once a remote cache is configured, and
      # harmless alongside it.
      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # §18 governance: Storybook must actually compile Tailwind. It silently
      # did not for two milestones; a green build proved nothing.
      - name: Build Storybook
        run: pnpm build:storybook

      - name: Storybook compiled its utilities
        run: pnpm check:storybook-css
